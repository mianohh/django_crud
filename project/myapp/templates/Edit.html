{% extends "base.html" %}
{% block title %}Edit person{% endblock %}
{% block content %}
<div class="mb-4"><div class="eyebrow">Directory</div><h1 class="page-title">Edit person</h1><p class="page-subtitle">Keep this profile's information up to date.</p></div>
<section class="surface form-card">
    <form method="post" enctype="multipart/form-data">
        {{ form.as_p }}
        <div class="d-flex align-items-center justify-content-between mt-4">
            <a href="/" class="btn btn-light"><i class="fa-solid fa-arrow-left"></i>Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i>Save changes</button>
        </div>
        {% csrf_token %}
    </form>
</section>
{% endblock %}
