{% extends "base.html" %}
{% block title %}Delete person{% endblock %}
{% block content %}
<section class="surface warning-card">
    <div class="empty-icon mx-auto" style="color:#e05260;background:#fff0f1;"><i class="fa-solid fa-trash-can"></i></div>
    <h1 class="page-title mb-2">Delete this person?</h1>
    <p class="page-subtitle mb-4">This action cannot be undone. The profile will be permanently removed from your directory.</p>
    <form method="post">
        {% csrf_token %}
        <a href="/" class="btn btn-light mr-2"><i class="fa-solid fa-arrow-left"></i>Keep profile</a>
        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash"></i>Delete permanently</button>
    </form>
</section>
{% endblock %}
