{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}People{% endblock %} · People</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --ink:#172033; --muted:#718096; --primary:#635bff; --primary-dark:#5148e5; --surface:#fff; --canvas:#f5f7fb; --line:#e7ebf3; --danger:#e05260; --shadow:0 18px 45px rgba(32,45,75,.08); }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background:var(--canvas); font-family:"DM Sans",sans-serif; }
        h1,h2,h3,h4,.brand { font-family:"Space Grotesk",sans-serif; }
        .app-nav { background:var(--surface); border-bottom:1px solid var(--line); }
        .nav-inner { min-height:76px; display:flex; align-items:center; justify-content:space-between; }
        .brand { color:var(--ink)!important; font-size:1.35rem; font-weight:700; letter-spacing:-.03em; }
        .brand-mark { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; margin-right:10px; color:#fff; background:linear-gradient(135deg,#7c72ff,#4d43df); border-radius:11px; box-shadow:0 8px 18px rgba(99,91,255,.25); }
        .nav-caption { color:var(--muted); font-size:.88rem; }
        main { padding:42px 0 64px; }
        .eyebrow { color:var(--primary); font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
        .page-title { margin:4px 0 0; font-size:2rem; font-weight:700; letter-spacing:-.04em; }
        .page-subtitle { color:var(--muted); margin:7px 0 0; }
        .surface { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); }
        .dashboard-hero { padding:28px 30px; color:#fff; background:linear-gradient(120deg,#4038b7,#6f68ef); border-radius:20px; box-shadow:0 18px 35px rgba(67,58,190,.2); }
        .dashboard-hero .eyebrow { color:#c9c6ff; }
        .dashboard-hero .page-subtitle { color:#dedcff; }
        .dashboard-hero .btn-light { color:var(--primary-dark); background:#fff; }
        .stat-card { display:flex; align-items:center; gap:14px; padding:19px; }
        .stat-icon { width:42px; height:42px; display:flex; align-items:center; justify-content:center; color:var(--primary); background:#eeedff; border-radius:12px; }
        .stat-label { color:var(--muted); font-size:.78rem; font-weight:600; }
        .stat-value { display:block; margin-top:1px; color:var(--ink); font-family:"Space Grotesk",sans-serif; font-size:1.35rem; font-weight:700; }
        .crud-panel { padding:20px; }
        .crud-panel-title { margin:0 0 4px; font-size:1rem; }
        .crud-panel-subtitle { color:var(--muted); font-size:.82rem; margin-bottom:15px; }
        .crud-actions { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
        .crud-action { display:flex; align-items:center; gap:9px; padding:12px 10px; color:var(--ink); background:#fafbfe; border:1px solid var(--line); border-radius:11px; font-size:.82rem; font-weight:600; text-decoration:none!important; transition:.15s ease; }
        .crud-action:hover { color:var(--primary); border-color:#cfcaff; background:#f7f6ff; transform:translateY(-1px); }
        .crud-action i { color:var(--primary); }
        .table-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; border-bottom:1px solid var(--line); }
        .search-box { position:relative; max-width:280px; width:100%; }
        .search-box i { position:absolute; top:14px; left:14px; color:#9aa3b5; font-size:.85rem; }
        .search-box input { width:100%; height:42px; padding:0 14px 0 38px; border:1px solid var(--line); border-radius:10px; outline:0; color:var(--ink); }
        .search-box input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,91,255,.12); }
        .results-note { color:var(--muted); font-size:.82rem; }
        .btn { border-radius:10px; font-weight:600; padding:.65rem 1rem; border:0; }
        .btn-primary { background:var(--primary); box-shadow:0 8px 16px rgba(99,91,255,.2); }
        .btn-primary:hover { background:var(--primary-dark); }
        .btn-light { color:var(--ink); background:#f0f2f8; }
        .btn-danger { background:var(--danger); }
        .btn-outline-secondary { border:1px solid var(--line); color:var(--muted); }
        .btn i { margin-right:7px; }
        .table-wrap { overflow-x:auto; }
        .people-table { margin:0; min-width:850px; }
        .people-table thead th { color:var(--muted); background:#fafbfe; border:0; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; padding:16px 20px; white-space:nowrap; }
        .people-table tbody td { border-color:var(--line); padding:16px 20px; vertical-align:middle; }
        .person-name { font-weight:700; }
        .person-email { color:var(--muted); font-size:.9rem; }
        .avatar { width:44px; height:44px; object-fit:cover; border-radius:13px; border:3px solid #fff; box-shadow:0 3px 10px rgba(32,45,75,.12); }
        .action-group { display:flex; gap:7px; }
        .action-btn { width:35px; height:35px; display:inline-flex; align-items:center; justify-content:center; padding:0; border-radius:9px; }
        .action-btn i { margin:0; font-size:.85rem; }
        .form-card { max-width:680px; margin:0 auto; padding:34px; }
        .form-card form p { margin-bottom:18px; }
        .form-card label { display:block; color:#4b5568; font-size:.86rem; font-weight:600; margin-bottom:7px; }
        .form-control { height:46px; border:1px solid var(--line); border-radius:10px; color:var(--ink); }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(99,91,255,.12); }
        input[type=file].form-control { height:auto; padding:.62rem .75rem; }
        .helptext { color:var(--muted); font-size:.8rem; }
        .errorlist { color:var(--danger); padding-left:18px; font-size:.85rem; }
        .detail-card { max-width:720px; margin:0 auto; padding:34px; }
        .detail-photo { width:112px; height:112px; object-fit:cover; border-radius:24px; box-shadow:0 12px 25px rgba(32,45,75,.14); }
        .detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
        .detail-item { background:#fff; padding:17px 19px; }
        .detail-label { color:var(--muted); display:block; font-size:.74rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px; }
        .empty-state { padding:62px 20px; text-align:center; color:var(--muted); }
        .empty-icon { width:58px; height:58px; display:flex; align-items:center; justify-content:center; margin:0 auto 15px; color:var(--primary); background:#eeedff; border-radius:18px; font-size:1.25rem; }
        .warning-card { max-width:540px; margin:30px auto; padding:42px; text-align:center; }
        @media (max-width:767px) { .crud-actions { grid-template-columns:1fr; } .dashboard-hero { padding:23px; } .stat-card { padding:15px; } }
        @media (max-width:575px) { main { padding-top:28px; } .page-title { font-size:1.65rem; } .form-card,.detail-card,.warning-card { padding:24px 20px; } .nav-caption { display:none; } .detail-grid { grid-template-columns:1fr; } .table-toolbar { align-items:stretch; flex-direction:column; gap:12px; } .search-box { max-width:none; } }
    </style>
</head>
<body>
    <nav class="app-nav">
        <div class="container nav-inner">
            <a class="brand text-decoration-none" href="/">
                <span class="brand-mark"><i class="fa-solid fa-users"></i></span>People
            </a>
            <div class="d-flex align-items-center">
                <span class="nav-caption mr-3 d-none d-sm-inline">Simple people management</span>
                <a href="/Add/" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i>Add person</a>
            </div>
        </div>
    </nav>
    <main>
        <div class="container">{% block content %}{% endblock %}</div>
    </main>
</body>
</html>
